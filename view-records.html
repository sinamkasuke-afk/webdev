<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Time Records</title>
  <link rel="stylesheet" href="employee.css">
</head>
<body>

<div class="dashboard">

  <aside class="sidebar">
    <h2>Employee</h2>
    <a href="employee.html">Time In / Time Out</a>
    <a class="active">View Time Records</a>
    <a href="leave-request.html">Leave Request</a>
    <button onclick="logout()">Log Out</button>
  </aside>

  <main class="content">
    <h1>View Time Records</h1>

    <div class="card">
      <h2>Time Records</h2>

      <table>
        <tr>
          <th>Date</th>
          <th>Time In</th>
          <th>Time Out</th>
          <th>Total Hours</th>
          <th>Status</th>
        </tr>

        <tr>
          <td>May 21, 2024</td>
          <td>08:30 AM</td>
          <td>05:00 PM</td>
          <td>8h 30m</td>
          <td style="color:green;">Present</td>
        </tr>

        <tr>
          <td>May 20, 2024</td>
          <td>08:25 AM</td>
          <td>05:15 PM</td>
          <td>8h 50m</td>
          <td style="color:green;">Present</td>
        </tr>

        <tr>
          <td>May 19, 2024</td>
          <td>-</td>
          <td>-</td>
          <td>0h</td>
          <td style="color:red;">Absent</td>
        </tr>

      </table>
    </div>

  </main>

</div>

<script src="employee.js"></script>
</body>
</html>
